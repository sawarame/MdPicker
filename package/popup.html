<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MdPicker</title>
  <style>
    body {
      margin: 0;
      padding: 6px 0;
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #24292f;
      background-color: #ffffff;
      box-sizing: border-box;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px 8px;
      border-bottom: 1px solid #eaeef2;
      margin-bottom: 4px;
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #1f2328;
    }
    .popup-brand img {
      width: 16px;
      height: 16px;
      display: block;
    }
    .btn-options-link {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #24292f;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .btn-options-link:hover {
      background-color: #eaeef2;
    }
    .menu-section {
      display: flex;
      flex-direction: column;
    }
    .menu-item-btn,
    .menu-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 12px;
      border: none;
      background: transparent;
      color: #24292f;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
      word-break: break-word;
    }
    .menu-item-btn:hover:not(:disabled),
    .menu-toggle-btn:hover:not(:disabled) {
      background-color: #f0f6ff;
      color: #0969da;
    }
    .menu-item-btn:focus-visible,
    .menu-toggle-btn:focus-visible,
    .btn-options-link:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: -2px;
    }
    .menu-item-btn:disabled {
      color: #8c959f;
      cursor: not-allowed;
      opacity: 0.65;
    }
    .toggle-arrow {
      font-size: 10px;
      color: #57606a;
      margin-left: 8px;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .menu-toggle-btn[aria-expanded="true"] .toggle-arrow {
      transform: rotate(90deg);
    }
    .submenu-list {
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
      border-top: 1px solid #f0f2f5;
      border-bottom: 1px solid #f0f2f5;
    }
    .submenu-list[hidden] {
      display: none;
    }
    .menu-sub-item-btn {
      padding-left: 24px;
      font-size: 12.5px;
    }
    .menu-divider {
      height: 1px;
      background-color: #eaeef2;
      margin: 4px 0;
      border: none;
    }
    .popup-status {
      min-height: 0;
      font-size: 12px;
      font-weight: 500;
      padding: 0 12px;
      transition: opacity 0.15s ease;
    }
    .popup-status:not(:empty) {
      padding: 6px 12px 2px;
      border-top: 1px solid #eaeef2;
      margin-top: 4px;
    }
    .popup-status.is-success {
      color: #1a7f37;
    }
    .popup-status.is-error {
      color: #cf222e;
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="popup-brand">
      <img src="images/icon16.png" alt="">
      <span>MdPicker</span>
    </div>
    <button type="button" id="btn-open-options" class="btn-options-link">Open Options</button>
  </header>

  <main>
    <div id="pinned-menu-list" class="menu-section"></div>

    <div id="other-formats-section" class="menu-section" hidden>
      <button
        type="button"
        id="btn-toggle-other"
        class="menu-toggle-btn"
        aria-expanded="false"
        aria-controls="other-formats-list"
      >
        <span class="toggle-label">Copy page in other formats...</span>
        <span class="toggle-arrow" aria-hidden="true">&#9654;</span>
      </button>
      <div id="other-formats-list" class="submenu-list" hidden></div>
    </div>

    <hr class="menu-divider">

    <div class="menu-section">
      <button type="button" id="btn-copy-selection" class="menu-item-btn" disabled>
        Copy selection as Markdown
      </button>
    </div>
  </main>

  <div id="popup-status" class="popup-status" role="status" aria-live="polite"></div>

  <script src="js/popup.js"></script>
</body>
</html>
