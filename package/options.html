<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MdPicker Options</title>
  <style>
    body {
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      width: 100%;
      max-width: 840px;
      margin: 0 auto;
      line-height: 1.5;
      box-sizing: border-box;
    }
    @media (min-width: 700px) {
      body {
        padding: 32px 24px;
      }
    }
    .options-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }
    .options-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      color: #1a1a1a;
    }
    h2 {
      font-size: 1.15rem;
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eaeaea;
    }
    .section-desc {
      font-size: 0.88rem;
      color: #666;
      margin-top: -6px;
      margin-bottom: 14px;
    }
    .option-item {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .option-item label {
      margin-left: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-details {
      margin-left: 24px;
      margin-top: 6px;
      display: flex;
      align-items: center;
    }
    .option-details label {
      margin-right: 8px;
      font-size: 0.9rem;
    }
    select, input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #0366d6;
    }
    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    th, td {
      padding: 6px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f7f7f7;
      font-weight: 600;
      color: #555;
    }
    .col-order {
      width: 80px;
      text-align: center;
      white-space: nowrap;
    }
    .col-pinned {
      width: 96px;
      text-align: center;
      white-space: nowrap;
    }
    .col-name {
      width: 104px;
      word-break: break-word;
    }
    .col-mimetype {
      width: 88px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.8rem;
      color: #555;
      white-space: nowrap;
    }
    .col-format {
      width: auto;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }
    .col-actions {
      width: 58px;
      text-align: center;
      white-space: nowrap;
    }
    .cell-pinned {
      text-align: center;
    }
    .order-controls {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      color: #888;
      font-size: 0.9rem;
      padding: 2px 3px;
      user-select: none;
      line-height: 1;
      letter-spacing: -1px;
      border-radius: 3px;
    }
    .drag-handle:hover {
      color: #333;
      background-color: #f3f4f6;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .btn-move {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      color: #333;
      cursor: pointer;
      font-size: 0.75rem;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 3px;
    }
    .btn-move:hover:not(:disabled) {
      background-color: #e5e7eb;
    }
    .btn-move:disabled {
      opacity: 0.35;
      cursor: default;
    }
    tr.dragging {
      opacity: 0.45;
      background-color: #f0f6ff;
    }
    tr.drag-over-above td {
      border-top: 2px solid #0366d6;
    }
    tr.drag-over-below td {
      border-bottom: 2px solid #0366d6;
    }
    .btn-delete {
      background: none;
      border: none;
      color: #d73a49;
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background-color: #ffeef0;
    }
    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .add-form input[type="text"]:first-child {
      flex: 1 1 110px;
      min-width: 90px;
    }
    .add-form select {
      flex: 0 0 100px;
    }
    .add-form input[type="text"]:nth-of-type(2) {
      flex: 2 1 160px;
      min-width: 120px;
    }
    .add-form .btn-primary {
      flex: 0 0 auto;
    }
    .btn-primary {
      background-color: #0366d6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-primary:hover {
      background-color: #0255b5;
    }
    .btn-secondary {
      background-color: #f3f4f6;
      color: #444;
      border: 1px solid #d1d5db;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .btn-secondary:hover {
      background-color: #e5e7eb;
    }
    .help-box {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #555;
      margin-top: 10px;
    }
    .help-box code {
      background-color: #eaecf0;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.82rem;
      color: #222;
    }
    #status {
      margin-top: 16px;
      color: #28a745;
      font-weight: 500;
      font-size: 0.9rem;
      min-height: 20px;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header class="options-header">
    <h1 class="options-title" id="options-title">MdPicker</h1>
  </header>

  <div class="option-item">
    <input type="checkbox" id="include-favicon">
    <label for="include-favicon" id="label-include-favicon">Include favicon in page link</label>
  </div>
  
  <div class="option-details" id="favicon-size-container">
    <label for="favicon-size" id="label-favicon-size">Size:</label>
    <select id="favicon-size">
      <option value="12">12px</option>
      <option value="16">16px</option>
      <option value="24">24px</option>
      <option value="32">32px</option>
    </select>
  </div>

  <h2 id="heading-templates">Format Templates</h2>
  <div class="section-desc" id="desc-templates"></div>

  <div class="option-item">
    <label for="shortcut-template" id="label-shortcut-template" style="margin-left: 0; margin-right: 8px;">Default format:</label>
    <select id="shortcut-template"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th class="col-order" id="th-order">Order</th>
        <th class="col-pinned" id="th-pinned">Pin to top</th>
        <th class="col-name" id="th-name">Name</th>
        <th class="col-mimetype" id="th-mimetype">MIME Type</th>
        <th class="col-format" id="th-format">Format</th>
        <th class="col-actions" id="th-actions">Actions</th>
      </tr>
    </thead>
    <tbody id="template-table-body"></tbody>
  </table>

  <div class="add-form">
    <input type="text" id="new-template-name" placeholder="Name">
    <select id="new-template-mimetype">
      <option value="text/plain">text/plain</option>
      <option value="text/html">text/html</option>
    </select>
    <input type="text" id="new-template-format" placeholder="Format">
    <button type="button" id="btn-add-template" class="btn-primary">Add</button>
  </div>

  <div class="help-box" id="variables-help"></div>

  <div class="footer-actions">
    <button type="button" id="btn-reset-templates" class="btn-secondary">Reset to Defaults</button>
  </div>
  
  <div id="status"></div>

  <script src="js/options.js"></script>
</body>
</html>
