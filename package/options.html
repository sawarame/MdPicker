<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MdPicker Options</title>
  <style>
    body {
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      min-width: 640px;
      max-width: 840px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h2 {
      font-size: 1.15rem;
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eaeaea;
    }
    .section-desc {
      font-size: 0.88rem;
      color: #666;
      margin-top: -6px;
      margin-bottom: 14px;
    }
    .option-item {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .option-item label {
      margin-left: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-details {
      margin-left: 24px;
      margin-top: 6px;
      display: flex;
      align-items: center;
    }
    .option-details label {
      margin-right: 8px;
      font-size: 0.9rem;
    }
    select, input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #0366d6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 0.88rem;
    }
    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f7f7f7;
      font-weight: 600;
      color: #555;
    }
    .col-name {
      width: 25%;
    }
    .col-format {
      width: 60%;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.82rem;
      word-break: break-all;
    }
    .col-actions {
      width: 15%;
      text-align: center;
    }
    .btn-delete {
      background: none;
      border: none;
      color: #d73a49;
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px 8px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background-color: #ffeef0;
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .add-form input[type="text"]:first-child {
      width: 30%;
    }
    .add-form input[type="text"]:nth-child(2) {
      width: 55%;
    }
    .btn-primary {
      background-color: #0366d6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-primary:hover {
      background-color: #0255b5;
    }
    .btn-secondary {
      background-color: #f3f4f6;
      color: #444;
      border: 1px solid #d1d5db;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .btn-secondary:hover {
      background-color: #e5e7eb;
    }
    .help-box {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #555;
      margin-top: 10px;
    }
    .help-box code {
      background-color: #eaecf0;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.82rem;
      color: #222;
    }
    #status {
      margin-top: 16px;
      color: #28a745;
      font-weight: 500;
      font-size: 0.9rem;
      min-height: 20px;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="option-item">
    <input type="checkbox" id="include-favicon">
    <label for="include-favicon" id="label-include-favicon">Include favicon in page link</label>
  </div>
  
  <div class="option-details" id="favicon-size-container">
    <label for="favicon-size" id="label-favicon-size">Size:</label>
    <select id="favicon-size">
      <option value="12">12px</option>
      <option value="16">16px</option>
      <option value="24">24px</option>
      <option value="32">32px</option>
    </select>
  </div>

  <h2 id="heading-templates">Format Templates</h2>
  <div class="section-desc" id="desc-templates"></div>

  <div class="option-item">
    <label for="shortcut-template" id="label-shortcut-template" style="margin-left: 0; margin-right: 8px;">Default format:</label>
    <select id="shortcut-template"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th class="col-name" id="th-name">Name</th>
        <th class="col-format" id="th-format">Format</th>
        <th class="col-actions" id="th-actions">Actions</th>
      </tr>
    </thead>
    <tbody id="template-table-body"></tbody>
  </table>

  <div class="add-form">
    <input type="text" id="new-template-name" placeholder="Name">
    <input type="text" id="new-template-format" placeholder="Format">
    <button type="button" id="btn-add-template" class="btn-primary">Add</button>
  </div>

  <div class="help-box" id="variables-help"></div>

  <div class="footer-actions">
    <button type="button" id="btn-reset-templates" class="btn-secondary">Reset to Defaults</button>
  </div>
  
  <div id="status"></div>

  <script src="js/options.js"></script>
</body>
</html>
