<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Darker, sleek slate background for a premium dark-mode feel -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/> <!-- Slate 800 -->
      <stop offset="100%" stop-color="#020617"/> <!-- Slate 950 -->
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  
  <g transform="translate(10.5, 40)">
    <!-- Markdown "M" Logo (Solid White) -->
    <path fill="#ffffff" d="M 0 48 L 0 0 L 16 0 L 30 18 L 44 0 L 60 0 L 60 48 L 46 48 L 46 22 L 30 38 L 14 22 L 14 48 Z" />
    
    <!-- Copy "Back Page" (Outline, slightly dimmed to create depth) -->
    <path fill="none" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
          d="M 81 20 V 8 C 81 5.8 82.8 4 85 4 H 101 C 103.2 4 105 5.8 105 8 V 28 C 105 30.2 103.2 32 101 32 H 89" />
          
    <!-- Copy "Front Page" (Solid White) -->
    <rect x="71" y="16" width="22" height="30" rx="3.5" fill="#ffffff" />
  </g>
</svg>
