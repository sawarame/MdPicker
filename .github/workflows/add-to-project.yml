name: Add issue to project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          # 追加先のプロジェクトURLを指定
          project-url: https://github.com/users/sawarame/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
